name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Go (vet, fmt, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  backend:
    name: Python (ruff, pytest + PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: hezarfen
          POSTGRES_USER: hezarfen
          POSTGRES_PASSWORD: hezarfen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hezarfen" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hezarfen
      POSTGRES_USER: hezarfen
      POSTGRES_PASSWORD: hezarfen
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Install GDAL/GEOS/PROJ (GeoDjango)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - run: pytest

  integration:
    # store/publish tests run against the real DDL, which Django migrations own (D-034)
    name: Go integration (PostGIS + Redis, migrated schema)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: hezarfen
          POSTGRES_USER: hezarfen
          POSTGRES_PASSWORD: hezarfen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U hezarfen" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hezarfen
      POSTGRES_USER: hezarfen
      POSTGRES_PASSWORD: hezarfen
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v5
      - name: Install GDAL/GEOS/PROJ (GeoDjango)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Create the schema with Django migrations
        working-directory: backend
        run: python manage.py migrate --noinput
      - uses: actions/setup-go@v6
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - name: store and publish tests (must run, not skip)
        working-directory: ingest
        env:
          INGEST_TEST_DATABASE_URL: postgres://hezarfen:hezarfen@localhost:5432/hezarfen
          INGEST_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          go test -v ./internal/store/... ./internal/publish/... | tee test.log
          ! grep -q -- '--- SKIP' test.log

  frontend:
    name: Frontend (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  stack:
    # the whole product the way a user starts it: every image builds, the prod-like stack
    # comes up healthy, seeds offline and passes the HTTP smoke test (incl. /ops)
    name: Docker images + stack smoke
    runs-on: ubuntu-latest
    needs: [ingest, backend, integration, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build every image (prod targets and the GDAL tools image)
        run: docker compose -f docker-compose.yml --profile tools build
      - name: Start the prod-like stack and wait until healthy
        run: make up-prod
      - name: Seed reference data from the bundled fixtures (no downloads)
        run: make seed REFERENCE_OFFLINE=1 COMPOSE="docker compose -f docker-compose.yml"
      - name: HTTP smoke test through nginx
        run: make smoke
      - name: Service logs
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail 200
