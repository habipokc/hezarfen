name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    name: Go (vet, fmt, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  backend:
    name: Python (ruff, pytest + PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: hezarfen
          POSTGRES_USER: hezarfen
          POSTGRES_PASSWORD: hezarfen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hezarfen" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: hezarfen
      POSTGRES_USER: hezarfen
      POSTGRES_PASSWORD: hezarfen
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Install GDAL/GEOS/PROJ (GeoDjango)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gdal-bin
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    name: Frontend (tsc, eslint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [ingest, backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build all service images (prod targets)
        run: docker compose -f docker-compose.yml build
