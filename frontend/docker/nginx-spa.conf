server {
    listen 5173;
    root /usr/share/nginx/html;

    # hashed assets never change; cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths render index.html
    location / {
        try_files $uri /index.html;
    }
}
