# Gateway: the only service exposed on the host. Routes by path prefix to the
# compose services, which are resolved through Docker's embedded DNS.

# Set Connection: upgrade only when the client asked for an upgrade, so plain
# HTTP requests keep normal keep-alive semantics.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    # redirects keep the browser's host:port (8800); absolute ones would name port 80
    absolute_redirect off;

    # JSON compresses ~10x (playback windows, province outlines), the JS bundles ~4x.
    # gzip_proxied any: responses from the backend count as proxied, which nginx skips by default.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/vnd.oai.openapi+json
               text/javascript application/javascript text/css image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ops {
        return 301 /ops/;
    }

    # REST API, admin, server-rendered ops panel and Django static files
    location ~ ^/(api|admin|ops|static)/ {
        proxy_pass http://backend;
    }

    # Live WebSocket feed: hop-by-hop headers must be forwarded explicitly
    location /ws/ {
        proxy_pass http://backend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # idle WebSockets would otherwise be cut after 60s; app heartbeats keep them warm
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Pre-rendered raster tiles (hillshade), produced by `make dem` into data/tiles
    # says which tiles exist and where they came from; must not outlive a new `make dem`
    location = /tiles/hillshade/meta.json {
        alias /srv/tiles/hillshade/meta.json;
        add_header Cache-Control "no-cache";
    }
    location /tiles/ {
        alias /srv/tiles/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Frontend: Vite dev server (with HMR websocket) in dev, static build in prod
    location / {
        proxy_pass http://frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
